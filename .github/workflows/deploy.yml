name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  DOCKERHUB_REPO: asdfghjklxd/trek
  GCP_PROJECT_ID: personal-project-476502
  GKE_CLUSTER: personal-project-cluster
  GKE_LOCATION: us-central1-a
  K8S_NAMESPACE: trek
  HELM_RELEASE: trek

jobs:
  version-bump:
    name: Compute next semver
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine next version from conventional commits
        id: bump
        run: |
          set -euo pipefail
          git fetch --tags --force

          LAST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)"
          RANGE="HEAD"
          CURRENT="0.0.0"
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
            CURRENT="${LAST_TAG#v}"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          COMMITS="$(git log "$RANGE" --pretty=format:'%s%n%b')"

          # Conventional-commit bump: a `!` or a BREAKING CHANGE footer wins,
          # then feat (minor), then fix (patch). No matching commit means
          # nothing release-worthy landed since the last tag.
          if echo "$COMMITS" | grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          elif echo "$COMMITS" | grep -qE '^fix(\([^)]*\))?:'; then
            PATCH=$((PATCH + 1))
          else
            echo "No feat/fix/breaking commits since ${LAST_TAG:-the start of history}; skipping release."
            exit 0
          fi

          VERSION="${MAJOR}.${MINOR}.${PATCH}"

          sed -i "s/^version: .*/version: $VERSION/" charts/trek/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"$VERSION\"/" charts/trek/Chart.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/trek/Chart.yaml
          git commit -m "chore: bump trek chart to $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin main --follow-tags

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push image
    needs: version-bump
    if: needs.version-bump.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-bump.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.version-bump.outputs.version }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ needs.version-bump.outputs.version }}
            ${{ env.DOCKERHUB_REPO }}:latest
          # No cache-from/cache-to: APP_VERSION is baked into the image at
          # build time, so a cached layer from a different tag must not reuse.
          no-cache: true

  deploy:
    name: Deploy to GKE via Helm
    needs: [version-bump, build-and-push]
    if: needs.version-bump.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-bump.outputs.version }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          helm upgrade --install "$HELM_RELEASE" ./charts/trek \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --set image.repository="$DOCKERHUB_REPO" \
            --set image.tag="${{ needs.version-bump.outputs.version }}" \
            --wait --timeout 5m
