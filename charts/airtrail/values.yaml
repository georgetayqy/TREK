nameOverride: ""
fullnameOverride: ""
namespace: airtrail

# -- PostgreSQL database
db:
  # CloudNativePG-managed Postgres (needs the CNPG operator). The app reads DB_URL from the
  # operator's <release>-db-app secret. Set enabled=false to use the bundled postgres Deployment.
  cnpg:
    enabled: true
    instances: 1
    imageName: "ghcr.io/cloudnative-pg/postgresql:18"
  # Image for the bundled Postgres (cnpg.enabled=false) and its wait-for-db init container.
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""  # "" = cluster default
  resources: {}

# -- AirTrail application
airtrail:
  replicaCount: 1
  image:
    repository: johly/airtrail
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  persistence:
    uploads:
      enabled: true
      size: 2Gi
      storageClass: ""  # "" = cluster default
  resources: {}
  ingress:
    enabled: true
    # Traefik on the Talos cluster; TLS is terminated at Cloudflare (no cert-manager/tls).
    className: "traefik"
    annotations: {}
    hosts:
      - host: airtrail.georgetay.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# -- Names shared by the CNPG cluster and the uploads mount
env:
  dbDatabaseName: "airtrail"
  dbUsername: "airtrail"
  uploadLocation: "/app/uploads"

# -- App configuration (ORIGIN, BODY_SIZE_LIMIT, ...) lives in the SealedSecret template
secret:
  existingSecret: "airtrail-secret"
