nameOverride: ""
fullnameOverride: ""
namespace: airtrail

# -- PostgreSQL database, managed by the CloudNativePG operator (must be installed in the cluster).
# The app reads DB_URL from the operator's <release>-db-app secret.
db:
  cnpg:
    instances: 1
    imageName: "ghcr.io/cloudnative-pg/postgresql:18"
    # PodMonitor so Prometheus scrapes the Postgres instances (skipped if the Prometheus Operator CRDs are absent).
    podMonitor:
      enabled: true
  persistence:
    size: 10Gi
    storageClass: ""  # "" = cluster default
  resources: {}

# -- AirTrail application
airtrail:
  replicaCount: 1
  image:
    repository: johly/airtrail
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  persistence:
    uploads:
      enabled: true
      size: 2Gi
      storageClass: ""  # "" = cluster default
  resources: {}
  ingress:
    enabled: true
    # Traefik on the Talos cluster; TLS is terminated at Cloudflare (no cert-manager/tls).
    className: "traefik"
    annotations: {}
    hosts:
      - host: airtrail.georgetay.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

# -- Names shared by the CNPG cluster and the uploads mount
env:
  dbDatabaseName: "airtrail"
  dbUsername: "airtrail"
  uploadLocation: "/app/uploads"

# -- App configuration (ORIGIN, BODY_SIZE_LIMIT, ...) lives in the SealedSecret template
secret:
  existingSecret: "airtrail-secret"
