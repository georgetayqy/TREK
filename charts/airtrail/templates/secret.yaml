---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: airtrail-secret
  namespace: airtrail
spec:
  encryptedData:
    BODY_SIZE_LIMIT: 
    DB_DATABASE_NAME: 
    DB_PASSWORD: 
    DB_URL: 
    DB_USERNAME: 
    ORIGIN: 
    UPLOAD_LOCATION: 
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: airtrail
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: airtrail
        app.kubernetes.io/version: latest
        helm.sh/chart: airtrail-0.1.0
      name: airtrail-secret
      namespace: airtrail
    type: Opaque
