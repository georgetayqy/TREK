---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: airtrail-secret
  namespace: airtrail
spec:
  encryptedData:
    BODY_SIZE_LIMIT: 
    INTEGRATIONS_AERO_DATA_BOX_KEY: 
    OAUTH_AUTO_LOGIN: 
    OAUTH_AUTO_REGISTER: 
    OAUTH_CLIENT_ID: 
    OAUTH_CLIENT_SECRET: 
    OAUTH_ENABLED: 
    OAUTH_HIDE_PASSWORD_FORM: 
    OAUTH_ISSUER_URL: 
    ORIGIN: 
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: airtrail
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: airtrail
        app.kubernetes.io/version: latest
        helm.sh/chart: airtrail-0.1.0
      name: airtrail-secret
      namespace: airtrail
    type: Opaque
