apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "airtrail.dbFullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "airtrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  instances: {{ .Values.db.cnpg.instances }}
  {{- with .Values.db.cnpg.imageName }}
  imageName: {{ . | quote }}
  {{- end }}
  # Keep the DB PVC/pods out of Velero file-system backups (not crash-consistent);
  # the Cluster manifest itself is still backed up.
  inheritedMetadata:
    labels:
      velero.io/exclude-from-backup: "true"
  {{- if .Values.db.cnpg.backup.enabled }}
  # Base backups + WAL archive to GCS via the Barman Cloud Plugin (needs cert-manager and the plugin,
  # both deployed by personal-cluster). Config: db-objectstore.yaml; credentials: db-backup-secret.yaml.
  # To restore, bootstrap a new Cluster with `bootstrap.recovery` + the same plugin ObjectStore.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ include "airtrail.dbFullname" . }}-backups
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.env.dbDatabaseName | quote }}
      owner: {{ .Values.env.dbUsername | quote }}
  storage:
    size: {{ .Values.db.persistence.size }}
    {{- with .Values.db.persistence.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
  resources:
    {{- toYaml .Values.db.resources | nindent 4 }}
