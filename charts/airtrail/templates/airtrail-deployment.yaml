apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "airtrail.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "airtrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.airtrail.replicaCount }}
  selector:
    matchLabels:
      {{- include "airtrail.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "airtrail.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      # uploads volume must be writable by UID:GID 1000:1000, per upstream image requirements
      # Pod Security Standards "restricted": non-root, RuntimeDefault seccomp, no privilege
      # escalation, all capabilities dropped.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: airtrail
          image: "{{ .Values.airtrail.image.repository }}:{{ .Values.airtrail.image.tag }}"
          imagePullPolicy: {{ .Values.airtrail.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: {{ include "airtrail.secretName" . }}
          env:
            # Explicit env wins over envFrom: use the credentials CNPG generated, not the sealed DB_URL.
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "airtrail.dbFullname" . }}-app
                  key: uri
          ports:
            - name: http
              containerPort: 3000
          # Ready only while the CNPG primary accepts TCP connections. The -rw Service has no
          # endpoints until a primary is elected, so this also covers failover. Uses node (the app's
          # own runtime) so no Postgres client tooling is needed in the image.
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - 'require("net").connect({host:"{{ include "airtrail.dbHost" . }}",port:5432,timeout:3000}).on("connect",()=>process.exit(0)).on("error",()=>process.exit(1)).on("timeout",()=>process.exit(1))'
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.env.uploadLocation }}
          resources:
            {{- toYaml .Values.airtrail.resources | nindent 12 }}
      volumes:
        - name: uploads
          {{- if .Values.airtrail.persistence.uploads.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "airtrail.fullname" . }}-uploads
          {{- else }}
          emptyDir: {}
          {{- end }}
