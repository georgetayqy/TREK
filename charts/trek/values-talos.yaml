# Overrides for the Talos cluster. Use after the base file:
#   helm upgrade --install trek ./charts/trek -f charts/trek/values-talos.yaml
env:
  APP_URL: "https://trek-new.georgetay.com"
  OIDC_CLIENT_ID: "hsVbDZf2cgKfg7RQTOGLmcBwQunu72hk"

# Sealed against the Talos sealed-secrets controller (the base file holds the GKE-sealed data).
sealedSecret:
  enabled: true
  encryptedData:
    ADMIN_EMAIL: 
    ADMIN_PASSWORD: 
    AERODATABOX_API_KEY: 
    AIRTRAIL_API_KEY: 
    ENCRYPTION_KEY: 
    OIDC_CLIENT_ID: 
    OIDC_CLIENT_SECRET: 
    UNSPLASH_ACCESS_KEY: 

persistence:
  data:
    storageClassName: local-path
  uploads:
    storageClassName: local-path

# Traefik on Talos; TLS is terminated at Cloudflare (no cert-manager / external-dns).
ingress:
  enabled: true
  className: "traefik"
  annotations: {}
  hosts:
    - host: trek-new.georgetay.com
      paths:
        - /
  tls: []
